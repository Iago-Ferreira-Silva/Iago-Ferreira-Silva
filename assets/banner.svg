<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="t d">
  <title id="t">Iago Ferreira Silva</title>
  <desc id="d">Desenvolvedor Front-End e IA</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#010409"/>
      <stop offset="0.55" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#0a1a33"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1f6feb" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#1f6feb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#9ecbff"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1f6feb" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#1f6feb" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fadeL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#010409" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#010409" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fadeR" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#010409" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#010409" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1f6feb" fill-opacity="0.35"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="320" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#dots)"/>

    <ellipse cx="420" cy="170" rx="440" ry="150" fill="url(#glow)">
      <animate attributeName="cx" values="420;780;420" dur="16s" repeatCount="indefinite"
               calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
    </ellipse>

    <rect width="260" height="320" fill="url(#fadeL)"/>
    <rect x="940" width="260" height="320" fill="url(#fadeR)"/>

    <!-- cantos -->
    <g fill="none" stroke="#1f6feb" stroke-opacity="0.55" stroke-width="1.5" stroke-linecap="round">
      <path d="M28 70 V28 H70"/>
      <path d="M1130 28 H1172 V70"/>
      <path d="M28 250 V292 H70"/>
      <path d="M1130 292 H1172 V250"/>
    </g>

    <text x="600" y="108" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','SF Mono',Consolas,'DejaVu Sans Mono',monospace" font-size="14" letter-spacing="4"
          fill="#58a6ff" fill-opacity="0.85">// olá, mundo
      <animate attributeName="fill-opacity" values="0;0.85" dur="1s" fill="freeze"/>
    </text>

    <text x="600" y="186" text-anchor="middle" font-family="'Inter','Segoe UI',-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="62" font-weight="600"
          letter-spacing="1" fill="url(#name)">Iago Ferreira Silva
      <animate attributeName="opacity" values="0;1" dur="1.1s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="0 10;0 0" dur="1.1s"
                        fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.7 0.2 1"/>
    </text>

    <rect x="600" y="212" width="0" height="2" rx="1" fill="url(#rule)">
      <animate attributeName="x" values="600;480" dur="1.2s" begin="0.4s" fill="freeze"/>
      <animate attributeName="width" values="0;240" dur="1.2s" begin="0.4s" fill="freeze"/>
    </rect>

    <text x="600" y="252" text-anchor="middle" font-family="'Inter','Segoe UI',-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="500"
          letter-spacing="7" fill="#58a6ff">DESENVOLVEDOR FRONT-END &amp; IA
      <animate attributeName="opacity" values="0;1" dur="1s" begin="0.7s" fill="freeze"/>
    </text>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="16" fill="none" stroke="#21262d"/>
</svg>
